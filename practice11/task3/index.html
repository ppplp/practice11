<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройка банковской карты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Настройка банковской карты</h1>

    <p>Введите текст:</p>
    <input class="cardText" type="text" placeholder="Введите текст на карте">

    <p>Выберите цвет карты:</p>
    <select class="cardColor">
        <option value="red">Красный</option>
        <option value="blue">Синий</option>
        <option value="green">Зелёный</option>
    </select>

    <p class="card">Ваша карта</p>
</body>
<script src="index.js"></script>
</html>
